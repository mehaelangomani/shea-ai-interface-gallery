<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OBJECT AI</title>
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/burgundy.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body data-page="signin" class="auth-page app-wine">
  <div class="auth-split">
    <div class="auth-visual auth-visual-red reveal-left" style="--reveal-delay: 0ms" aria-hidden="true">
      <div class="scan-grid"></div>
      <h2 class="auth-visual-headline editorial">See what's really there.</h2>
      <span class="tech-label tech-label-light">VISION ENGINE</span>
      <span class="tech-label auth-tag-ready">READY</span>
      <span class="tech-label auth-tag-detect">AI DETECTION</span>
      <div class="auth-visual-scene">
        <div class="scan-line"></div>
        <div class="det-box det-a" data-label="OBJECT"></div>
        <div class="det-box det-b" data-label="SCAN 04"></div>
      </div>
      <p class="auth-visual-logo">OBJECT AI</p>
    </div>
    <div class="auth-form-wrap auth-form-card reveal-right" style="--reveal-delay: 140ms">
      <a href="index.html" class="auth-back text-link">← Back to home</a>
      <h1 class="auth-title reveal-up" style="--reveal-delay: 240ms">Sign in</h1>
      <p class="auth-subtitle">Access your object identification workspace.</p>
      <form id="signin-form" class="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <p class="auth-forgot"><a href="#" class="text-link" onclick="return false;">Forgot password?</a></p>
        <p id="signin-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
