<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — Nexus AI</title>
  <meta
    name="description"
    content="Sign in to Nexus AI — your intelligent workspace for chat, research, creation and building."
  >

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-page">

    <!-- Background artwork -->
    <div class="art-orbit orbit-one"></div>
    <div class="art-orbit orbit-two"></div>
    <div class="art-glow glow-one"></div>
    <div class="art-glow glow-two"></div>

    <!-- Top navigation -->
    <header class="login-header">
      <a href="index.html" class="brand">
        <span class="brand-mark">NX</span>
        <span>NEXUS AI</span>
      </a>

      <a href="index.html" class="back-link">
        <span>←</span>
        BACK TO NEXUS AI
      </a>
    </header>

    <!-- Login content -->
    <section class="login-content">

      <div class="login-intro">
        <p class="eyebrow">NEXUS AI / ACCOUNT</p>

        <h1>
          WELCOME<br>
          <span>BACK.</span>
        </h1>

        <p class="intro-text">
          Continue where your ideas left off.
          Chat, create, research and build from one intelligent workspace.
        </p>
      </div>

      <div class="login-form-wrap">

        <div class="form-header">
          <p class="form-kicker">SIGN IN</p>
          <h2>Enter your workspace.</h2>
        </div>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">EMAIL ADDRESS</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >

            <small class="error-message" id="email-error"></small>
          </div>

          <div class="field">
            <div class="password-label">
              <label for="password">PASSWORD</label>

              <a href="#" id="forgot-password">
                FORGOT PASSWORD?
              </a>
            </div>

            <div class="password-input">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="password-toggle"
                aria-label="Show password"
              >
                SHOW
              </button>
            </div>

            <small class="error-message" id="password-error"></small>
          </div>

          <button type="submit" class="login-button">
            <span>SIGN IN</span>
            <span class="button-arrow">→</span>
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <button type="button" class="google-button" id="google-login">
            <span class="google-icon">G</span>
            <span>CONTINUE WITH GOOGLE</span>
          </button>

        </form>

        <p class="signup-prompt">
          DON'T HAVE AN ACCOUNT?
          <a href="signup.html">CREATE ONE</a>
        </p>

      </div>

    </section>

    <!-- Bottom information -->
    <footer class="login-footer">
      <span>© 2026 NEXUS AI</span>

      <div>
        <a href="#">PRIVACY</a>
        <a href="#">TERMS</a>
      </div>
    </footer>

  </main>

  <script>
const loginForm = document.getElementById("loginForm");

if (loginForm) {
  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    // Demo template — no authentication
    window.location.href = "dashboard.html";
  });
}
</script>

</body>
</html>
