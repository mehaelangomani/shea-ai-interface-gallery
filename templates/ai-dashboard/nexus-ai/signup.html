<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — NexusAI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-public-page="signup">
  <header class="landing-header" style="position:relative;">
    <div class="landing-header-inner">
      <a href="index.html" class="logo"><span class="logo-mark sm">NX</span>NexusAI</a>
      <nav class="landing-nav" aria-label="Primary">
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="pricing.html">Pricing</a>
        <a href="index.html#about">About</a>
      </nav>
      <div class="landing-actions">
        <a href="login.html" class="btn btn-ghost">Sign In</a>
        <a href="signup.html" class="btn btn-primary">Get Started</a>
      </div>
    </div>
  </header>
  <div class="auth-page">
    <div class="auth-panel">
      <h1>Create your account</h1>
      <p class="subtitle">Start building with AI.</p>

      <div class="auth-social">
        <button type="button" class="btn">Sign up with Google</button>
        <button type="button" class="btn">Sign up with GitHub</button>
      </div>

      <div class="auth-divider">OR</div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" class="input" name="name" autocomplete="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" class="input" name="password" autocomplete="new-password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" data-toggle-password="password">Show</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <p class="text-muted" style="font-size:0.75rem;margin-top:0.35rem;" id="strength-label"></p>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirm" class="input" name="confirm" autocomplete="new-password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" data-toggle-password="confirm">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
    <aside class="auth-visual" aria-hidden="true">
      <div class="auth-visual-inner">
        <div class="auth-shape s1"></div>
        <div class="auth-shape s2"></div>
        <div class="auth-shape s3"></div>
        <span class="auth-visual-label">Start building today</span>
      </div>
    </aside>
  </div>
  <script src="js/global.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
