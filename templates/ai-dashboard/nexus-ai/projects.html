<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects — NexusAI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/projects.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <header class="page-header">
          <h1>My Projects</h1>
          <p>Your conversations, files and generated work in one place.</p>
        </header>
        <div class="toolbar-row">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search" class="input" id="project-search" placeholder="Search projects" aria-label="Search projects">
          </div>
          <button type="button" class="btn btn-primary" id="new-project">New Project</button>
        </div>
        <div class="filter-tabs" role="tablist">
          <button type="button" class="filter-tab active" data-filter="all">All</button>
          <button type="button" class="filter-tab" data-filter="chats">Chats</button>
          <button type="button" class="filter-tab" data-filter="images">Images</button>
          <button type="button" class="filter-tab" data-filter="documents">Documents</button>
          <button type="button" class="filter-tab" data-filter="code">Code</button>
        </div>
        <div class="projects-grid" id="projects-grid" style="margin-top:1.25rem;"></div>
      </div>
    </main>
  </div>
  <script src="js/global.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
