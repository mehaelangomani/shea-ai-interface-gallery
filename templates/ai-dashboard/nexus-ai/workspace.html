<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace — NexusAI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <div class="workspace-layout">
          <div class="workspace-main">
            <header class="workspace-greeting">
              <h1 id="user-greeting">Good morning, Meha.</h1>
              <p>What are you building today?</p>
            </header>

            <div class="capability-cards">
              <button type="button" class="cap-card" data-href="chat.html?fresh=1">
                <h3>Chat</h3>
                <p>Ask, learn, explain</p>
              </button>
              <button type="button" class="cap-card" data-href="chat.html?fresh=1">
                <h3>Research</h3>
                <p>Analyze, compare, discover</p>
              </button>
              <button type="button" class="cap-card" data-href="chat.html?fresh=1">
                <h3>Create</h3>
                <p>Generate images, content and designs</p>
              </button>
              <button type="button" class="cap-card" data-href="chat.html?fresh=1">
                <h3>Build</h3>
                <p>Code and develop</p>
              </button>
            </div>

            <section class="idea-section">
              <h2>Start with an idea</h2>
              <div class="prompt-chips">
                <button type="button" class="chip" data-prompt="Create a travel website for Japan">Create a travel website</button>
                <button type="button" class="chip" data-prompt="Explain machine learning in simple terms">Explain machine learning</button>
                <button type="button" class="chip" data-prompt="Create a study plan for AI fundamentals">Create a study plan</button>
                <button type="button" class="chip" data-prompt="Design a minimal portfolio for a product designer">Design a portfolio</button>
              </div>

              <div class="workspace-composer">
                <label for="workspace-prompt" class="sr-only">Describe what you want to do</label>
                <textarea id="workspace-prompt" rows="2" placeholder="Describe what you want to do…"></textarea>
                <div class="composer-toolbar">
                  <div class="composer-tools">
                    <button type="button" class="tool-btn" data-label="Add">+</button>
                    <button type="button" class="tool-btn" data-label="Search">Search</button>
                    <button type="button" class="tool-btn" data-label="Attach">Attach</button>
                    <button type="button" class="tool-btn" data-label="Deep Think">Deep Think</button>
                    <button type="button" class="tool-btn" data-label="Voice">Voice</button>
                  </div>
                  <button type="button" class="btn btn-primary btn-sm" id="workspace-send">Send</button>
                </div>
              </div>
            </section>
          </div>

          <aside class="workspace-aside">
            <div class="aside-visual" aria-hidden="true"></div>
            <div class="active-projects">
              <h3>Recent workflows</h3>
              <div id="active-projects-list"></div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <script src="js/global.js"></script>
  <script src="js/workspace.js"></script>
</body>
</html>
