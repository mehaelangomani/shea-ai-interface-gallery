<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NexusAI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-public-page="login">
  <header class="landing-header" style="position:relative;">
    <div class="landing-header-inner">
      <a href="index.html" class="logo"><span class="logo-mark sm">NX</span>NexusAI</a>
      <nav class="landing-nav" aria-label="Primary">
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="pricing.html">Pricing</a>
        <a href="index.html#about">About</a>
      </nav>
      <div class="landing-actions">
        <a href="login.html" class="btn btn-ghost">Sign In</a>
        <a href="signup.html" class="btn btn-primary">Get Started</a>
      </div>
    </div>
  </header>
  <div class="auth-page">
    <div class="auth-panel">
      <h1>Welcome back</h1>
      <p class="subtitle">Continue to your AI workspace.</p>

      <div class="auth-social">
        <button type="button" class="btn">Continue with Google</button>
        <button type="button" class="btn">Continue with GitHub</button>
      </div>

      <div class="auth-divider">OR</div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" class="input" name="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" data-toggle-password="password">Show</button>
          </div>
        </div>
        <a href="#" class="forgot-link" id="forgot-password">Forgot password?</a>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
    <aside class="auth-visual" aria-hidden="true">
      <div class="auth-visual-inner">
        <div class="auth-shape s1"></div>
        <div class="auth-shape s2"></div>
        <div class="auth-shape s3"></div>
        <span class="auth-visual-label">Your AI workspace</span>
      </div>
    </aside>
  </div>
  <script src="js/global.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('forgot-password')?.addEventListener('click', (e) => {
      e.preventDefault();
      NexusAI.toast('Password reset link sent');
    });
  </script>
</body>
</html>
