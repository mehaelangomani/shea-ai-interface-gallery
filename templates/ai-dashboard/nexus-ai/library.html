<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — NexusAI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/library.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <header class="page-header">
          <h1>Your Library</h1>
          <p>Everything you've saved, generated, and want to keep.</p>
        </header>

        <div class="library-toolbar">
          <div class="library-search">
            <input type="search" class="input" id="library-search" placeholder="Search your library…" aria-label="Search your library">
          </div>
        </div>

        <div class="library-filters filter-tabs" role="tablist">
          <button type="button" class="filter-tab active" data-filter="all">All</button>
          <button type="button" class="filter-tab" data-filter="images">Images</button>
          <button type="button" class="filter-tab" data-filter="documents">Documents</button>
          <button type="button" class="filter-tab" data-filter="code">Code</button>
          <button type="button" class="filter-tab" data-filter="saved">Saved</button>
        </div>

        <div class="library-grid" id="library-grid"></div>
        <p class="library-empty" id="library-empty" hidden>No assets match your search.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="library-view-modal" role="dialog" aria-labelledby="library-view-title" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 id="library-view-title">Asset</h3>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p id="library-view-body" style="font-size:0.875rem;color:var(--text-secondary);"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close>Close</button>
        <button type="button" class="btn btn-primary" data-modal-close id="library-export">Export</button>
      </div>
    </div>
  </div>

  <script src="js/global.js"></script>
  <script src="js/library.js"></script>
  <script>
    document.getElementById('library-export')?.addEventListener('click', () => NexusAI.toast('Export started'));
  </script>
</body>
</html>
