<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QuizAI</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="" width="36" height="36" /> QuizAI</a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" data-public-nav="home">Home</a>
        <a href="features.html" data-public-nav="features">Features</a>
        <a href="pricing.html" data-public-nav="pricing">Pricing</a>
        <a href="login.html" data-public-nav="login">Login</a>
      </nav>
      <div class="site-header__actions">
        <a href="signup.html" class="btn btn--primary">Get Started</a>
        <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <nav class="mobile-nav" aria-label="Mobile">
    <a href="index.html" data-public-nav="home">Home</a>
    <a href="features.html" data-public-nav="features">Features</a>
    <a href="pricing.html" data-public-nav="pricing">Pricing</a>
    <a href="login.html" data-public-nav="login">Login</a>
    <a href="signup.html" class="btn btn--primary btn--block">Get Started</a>
  </nav>

  <div class="auth-page">
    <div class="botanical auth-botanical--tl botanical--leaf-1 leaf" aria-hidden="true">
      <svg viewBox="0 0 24 28"><path d="M12 2C8 8 6 14 8 22c4-2 8-6 10-12-3-2-4-6-6-8z" fill="#39AEB4" opacity="0.5"/></svg>
    </div>
    <div class="botanical auth-botanical--br botanical--leaf-2 leaf" aria-hidden="true">
      <svg viewBox="0 0 24 28"><path d="M10 4c-2 6-1 12 4 18 5-4 8-10 6-16-4 1-7-1-10-2z" fill="#CDEFE7"/></svg>
    </div>

    <div class="card auth-card">
      <div class="card__body">
        <a href="index.html" class="logo auth-card__logo">
          <img src="assets/logo.svg" alt="" width="40" height="40" /> QuizAI
        </a>
        <h1>Welcome Back</h1>
        <p class="auth-card__sub">Log in to continue your learning journey.</p>
        <form id="login-form" novalidate>
          <div class="form-group" data-field="email">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />
            <span class="form-error"></span>
          </div>
          <div class="form-group" data-field="password">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" />
            <span class="form-error"></span>
          </div>
          <div class="checkbox-row" style="justify-content:space-between;margin-bottom:20px">
            <label class="checkbox-row"><input type="checkbox" name="remember" /> Remember me</label>
            <a href="#" style="font-size:14px">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Login</button>
        </form>
        <div class="divider-text">or continue with</div>
        <div class="auth-social">
          <button type="button" class="btn btn--secondary btn--block">Continue with Google</button>
          <button type="button" class="btn btn--secondary btn--block">Continue with Microsoft</button>
        </div>
        <p class="auth-card__footer">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
