<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — AI Imag</title>

    <meta
        name="description"
        content="Sign in to AI Imag."
    >

    <!-- Existing fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="login-bg-glow glow-one"></div>
    <div class="login-bg-glow glow-two"></div>
    <div class="login-grid"></div>


    <!-- TOP BAR -->
    <header class="login-header">

        <a href="index.html" class="login-logo">
            <span>AI</span> Imag
        </a>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to AI Imag
        </a>

    </header>


    <!-- LOGIN -->
    <main class="login-page">

        <section class="login-card">

            <div class="login-card-glow"></div>

            <div class="login-intro">

                <div class="login-icon">
                    <i class="fa-solid fa-sparkles"></i>
                </div>

                <span class="login-eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Sign in to
                    <span>AI Imag.</span>
                </h1>

                <p>
                    Continue creating extraordinary images
                    with AI.
                </p>

            </div>


            <!-- FORM -->
            <form
                class="login-form"
                id="loginForm"
            >

                <!-- EMAIL -->
                <div class="login-field">

                    <label for="loginEmail">
                        Email address
                    </label>

                    <div class="input-wrap">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="login-field">

                    <div class="field-label-row">

                        <label for="loginPassword">
                            Password
                        </label>

                        <button
                            type="button"
                            class="forgot-link"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </button>

                    </div>

                    <div class="input-wrap">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->
                <label class="remember-row">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span class="custom-check"></span>

                    <span>
                        Remember me
                    </span>

                </label>


                <!-- ERROR -->
                <div
                    class="login-message"
                    id="loginMessage"
                ></div>


                <!-- SIGN IN -->
                <button
                    type="submit"
                    class="login-submit"
                    id="loginSubmit"
                >

                    <span>Sign In</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- DIVIDER -->
            <div class="login-divider">
                <span>OR</span>
            </div>


            <!-- GOOGLE -->
            <button
                type="button"
                class="google-login"
                id="googleLogin"
            >

                <span class="google-icon">
                    G
                </span>

                Continue with Google

            </button>


            <!-- CREATE ACCOUNT -->
            <p class="create-account">

                Don't have an account?

                <button
                    type="button"
                    id="createAccount"
                >
                    Create one
                </button>

            </p>


            <!-- DEMO NOTE -->
            <div class="login-note">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Your creative workspace stays private.
                </span>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
